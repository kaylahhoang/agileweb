<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - Tutoring System</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

    <div id = "layout">  </div>

    <div class="content">
        <div class="messages-layout">

            <section class="conversation-panel">
                <div class="panel-header">
                    <h2 class="mb-0">Messages</h2>
                </div>

                <div class="search-box">
                    <span>🔍</span>
                    <input type="text" placeholder="Search messages">
                </div>

                <div class="conversation-list">
                    <button class="conversation-item active" data-name="Emma Lee" data-role="Math Tutor">
                        <div class="conversation-avatar">E</div>
                        <div class="conversation-info">
                            <div class="conversation-top">
                                <h6 class="mb-0">Emma Lee</h6>
                                <span>10:24 AM</span>
                            </div>
                            <p class="mb-0">Reminder: bring your worksheet for today.</p>
                        </div>
                    </button>

                    <button class="conversation-item" data-name="Daniel Tan" data-role="Physics Tutor">
                        <div class="conversation-avatar">D</div>
                        <div class="conversation-info">
                            <div class="conversation-top">
                                <h6 class="mb-0">Daniel Tan</h6>
                                <span>Yesterday</span>
                            </div>
                            <p class="mb-0">The room has changed to Lab 3.</p>
                        </div>
                    </button>

                    <button class="conversation-item" data-name="Sarah Lim" data-role="English Tutor">
                        <div class="conversation-avatar">S</div>
                        <div class="conversation-info">
                            <div class="conversation-top">
                                <h6 class="mb-0">Sarah Lim</h6>
                                <span>Mon</span>
                            </div>
                            <p class="mb-0">Let me know if you need extra feedback.</p>
                        </div>
                    </button>
                </div>
            </section>

            <section class="chat-panel">
                <div class="chat-header">
                    <div>
                        <h5 id="chatName" class="mb-1">Emma Lee</h5>
                        <p id="chatRole" class="mb-0">Math Tutor</p>
                    </div>
                </div>

                <div class="chat-messages" id="chatMessages">
                    <div class="message-row received">
                        <div class="message-bubble">
                            Hi! Just a reminder that your Maths class starts at 4:00 PM today.
                        </div>
                    </div>

                    <div class="message-row sent">
                        <div class="message-bubble">
                            Thanks! I’ll be there on time.
                        </div>
                    </div>

                    <div class="message-row received">
                        <div class="message-bubble">
                            Great. Bring your worksheet for chapter 5 as well.
                        </div>
                    </div>
                </div>

                <form class="chat-input-area" id="messageForm">
                    <input type="text" id="messageInput" placeholder="Type your message here..." autocomplete="off">
                    <button type="submit" class="btn btn-primary">
                        Send
                    </button>
                </form>
            </section>

        </div>
    </div>
</div>

<script>

fetch('layout.html')
    .then(res => res.text())
    .then(html => {
        document.getElementById('layout').innerHTML = html;

        document.getElementById('pageTitle').textContent = document.body.dataset.title;

        // move tutor cards into the layout's content slot
        document.getElementById('pageContent').appendChild(
            document.querySelector('.messages-layout')
        );

        document.getElementById('toggleSidebar').addEventListener('click', function () {
            document.querySelector('.sidebar').classList.toggle('collapsed');
        });

        document.body.style.visibility = "visible";
    });


const conversations = {
    "Emma Lee": {
        role: "Math Tutor",
        messages: [
            { type: "received", text: "Hi! Just a reminder that your Maths class starts at 4:00 PM today." },
            { type: "sent", text: "Thanks! I’ll be there on time." },
            { type: "received", text: "Great. Bring your worksheet for chapter 5 as well." }
        ]
    },
    "Daniel Tan": {
        role: "Physics Tutor",
        messages: [
            { type: "received", text: "Hi, the room for today’s class has changed to Lab 3." },
            { type: "sent", text: "Okay, thanks for letting me know." },
            { type: "received", text: "No worries. See you this afternoon." }
        ]
    },
    "Sarah Lim": {
        role: "English Tutor",
        messages: [
            { type: "received", text: "Let me know if you want extra feedback on your essay." },
            { type: "sent", text: "Yes please, that would be really helpful." },
            { type: "received", text: "Of course. Send me your draft before Thursday." }
        ]
    }
};

let activeConversation = "Emma Lee";

const chatName = document.getElementById("chatName");
const chatRole = document.getElementById("chatRole");
const chatMessages = document.getElementById("chatMessages");
const messageForm = document.getElementById("messageForm");
const messageInput = document.getElementById("messageInput");
const conversationButtons = document.querySelectorAll(".conversation-item");

function renderMessages(name) {
    const currentChat = conversations[name];

    chatName.textContent = name;
    chatRole.textContent = currentChat.role;
    chatMessages.innerHTML = "";

    currentChat.messages.forEach(function(message) {
        const messageRow = document.createElement("div");
        messageRow.className = "message-row " + message.type;

        const messageBubble = document.createElement("div");
        messageBubble.className = "message-bubble";
        messageBubble.textContent = message.text;

        messageRow.appendChild(messageBubble);
        chatMessages.appendChild(messageRow);
    });

    chatMessages.scrollTop = chatMessages.scrollHeight;
}

conversationButtons.forEach(function(button) {
    button.addEventListener("click", function() {
        conversationButtons.forEach(function(item) {
            item.classList.remove("active");
        });

        button.classList.add("active");
        activeConversation = button.dataset.name;
        renderMessages(activeConversation);
    });
});

messageForm.addEventListener("submit", function(event) {
    event.preventDefault();

    const newMessage = messageInput.value.trim();

    if (newMessage === "") {
        return;
    }

    conversations[activeConversation].messages.push({
        type: "sent",
        text: newMessage
    });

    renderMessages(activeConversation);
    messageInput.value = "";
});

renderMessages(activeConversation);


</script>
</body>
</html>
