<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}App{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

<header class="app-header d-flex align-items-center">
    <button id="toggleSidebar" class="btn btn-light">☰</button>
    <h1 class="header-title header-center">{% block page_title %}App{% endblock %}</h1>
    <div class="header-right">
        <a href="#" class="btn btn-light">Logout</a>
    </div>
</header>

<div class="d-flex">
    <div class="sidebar">
        <h4 class="app-header">Navigation</h4>
        <ul class="nav flex-column mt-4">
            <li class="nav-item">
                <a class="nav-link text-white" href="/dashboard">Dashboard</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white" href="/bookings">Bookings</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white" href="/tutors">Tutors</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white" href="/messages">Messages</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white" href="/profile">Profile</a>
            </li>
        </ul>
    </div>

    <div class="content">
        {% block content %}{% endblock %}
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script>
    document.getElementById('toggleSidebar').addEventListener('click', function () {
        document.querySelector('.sidebar').classList.toggle('collapsed');
    });
</script>

</body>
</html>
