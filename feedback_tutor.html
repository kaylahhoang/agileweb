<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feedback tutor</title>
    
    <!-- bootstrap and unified css style -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="./css/styles.css">

    <style>
        
    </style>
</head>
<body>
<div id="layout"></div>
    <!-- main content -->
    <div class="flex-grow-1 p-4 feedback-content">
        <h2 class="mb-2">Manage student feedback records</h2>

        <!-- Month and add feedback button -->
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h4 class="m-0">March</h4>

            <button class="btn btn-primary"
                    data-bs-toggle="modal"
                    data-bs-target="#feedbackModal">
                Add Feedback
            </button>
        </div>

        <!-- feedback card 1 -->
        <div class="card feedback-card mb-3">
            <div class="card-body">

                <div class="d-flex justify-content-between mb-2">
                    <h5 class="m-0">Algebra Support</h5>
                    <button class="btn btn-sm btn-outline-secondary"
                            data-bs-toggle="modal"
                            data-bs-target="#feedbackModal">
                        Edit
                    </button>
                </div>

                <p class="mb-1"><strong>Student:</strong> Emily Chen</p>

                <div class="note-box">
                    Good understanding of equations. Needs more practice with word problems.
                </div>

            </div>
        </div>

        <!-- feedback card 2 -->
         <div class="card feedback-card mb-3">
            <div class="card-body">

                <div class="d-flex justify-content-between mb-2">
                    <h5 class="m-0">Algebra Support</h5>
                    <button class="btn btn-sm btn-outline-secondary"
                            data-bs-toggle="modal"
                            data-bs-target="#feedbackModal">
                        Edit
                    </button>
                </div>

                <p class="mb-1"><strong>Student:</strong>Jackson Wong</p>

                <div class="note-box"> 
                    Good understanding of equations. Needs more practice with word problems.
                </div>

            </div>
        </div>
    </div>
</div>
<!-- feedback modal -->
 <div class="modal fade" id="feedbackModal">
    <div class="modal-dialog">
        <div class="modal-content">

            <!-- header -->
            <div class="modal-header">
                <h5 class="modal-title">Add Feedback</h5>
                <button class="btn-close" data-bs-dismiss="modal"></button>
            </div>

            <!-- body -->
            <div class="modal-body">

                <div class="mb-3">
                    <label class="form-label">Session</label>
                    <input class="form-control" placeholder="Enter session">
                </div>

                <div class="mb-3">
                    <label class="form-label">Student</label>
                    <input class="form-control" placeholder="Enter student">
                </div>

                <div class="mb-3">
                    <label class="form-label">Note</label>
                    <textarea class="form-control" rows="3" placeholder="Write feedback..."></textarea>
                </div>

            </div>

            <!-- footer -->
            <div class="modal-footer">
                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button class="btn btn-primary">Submit</button>
            </div>

        </div>
    </div>
</div>

<script>
    fetch('layout.html')
    .then(res => res.text())
    .then(html => {
        document.getElementById('layout').innerHTML = html;

        document.getElementById('pageTitle').textContent = document.body.dataset.title;

        // move tutor cards into the layout's content slot
        document.getElementById('pageContent').appendChild(
            document.querySelector('.feedback-content')
        );

        document.getElementById('toggleSidebar').addEventListener('click', function () {
            document.querySelector('.sidebar').classList.toggle('collapsed');
        });

        document.body.style.visibility = "visible";
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
