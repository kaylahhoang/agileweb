<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Feedback</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<!-- ── Header ── -->
<header class="app-header d-flex align-items-center">
    <button id="toggleSidebar" class="btn btn-light">☰</button>
    <h1 class="header-title">TUTOR BOOKING SYSTEM</h1>
    <div class="header-right">
        <a href="#" class="btn btn-light">Logout</a>
    </div>
</header>

<!-- ── Body: sidebar + content ── -->
<div class="d-flex">

    <!-- Sidebar -->
    <div class="sidebar">
        <h4 class="app-header">Navigation</h4>
        <ul class="nav flex-column mt-4">
            <li class="nav-item">
                <a class="nav-link text-white" href="dashboard.html">Dashboard</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white" href="schedule.html">Bookings</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white" href="Tutor_resume_page.html">Tutors</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white" href="messages.html">Messages</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white active" href="feedback_student.html">Feedback</a>
            </li>
            <li class="nav-item">
                <a class="nav-link text-white" href="profile.html">Profile</a>
            </li>
        </ul>
    </div>

    <!-- Main feedback content -->
    <div class="content feedback-content flex-grow-1 p-4">

    <h2 class="mb-2">Submit Feedback</h2>
    <p class="text-muted mb-4">Share your experience with your tutor.</p>

    <!-- Submission form card -->
    <div class="main-card mb-4">
        <h5 class="mb-3">New Feedback</h5>

        <div id="formAlert" class="alert d-none" role="alert"></div>

        <div class="mb-3">
            <label class="form-label" for="fbSession">Session</label>
            <select class="form-select" id="fbSession">
                <option value="" disabled selected>Select a session…</option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Rating</label>
            <div class="star-rating" id="starRating" role="group" aria-label="Rating">
                <button class="star-btn" data-value="1" aria-label="1 star">★</button>
                <button class="star-btn" data-value="2" aria-label="2 stars">★</button>
                <button class="star-btn" data-value="3" aria-label="3 stars">★</button>
                <button class="star-btn" data-value="4" aria-label="4 stars">★</button>
                <button class="star-btn" data-value="5" aria-label="5 stars">★</button>
            </div>
            <input type="hidden" id="fbRating" value="0">
        </div>

        <div class="mb-3">
            <label class="form-label" for="fbComment">Comments</label>
            <textarea class="form-control" id="fbComment" rows="4"
                      placeholder="Describe your experience…"></textarea>
        </div>

        <button class="btn btn-primary" id="submitFeedbackBtn">Submit Feedback</button>
    </div>

    <!-- Submitted feedback list -->
    <div class="main-card">
        <h5 class="mb-3">Your Previous Feedback</h5>
        <div id="myFeedbackList">
            <p class="text-muted">Loading your feedback…</p>
        </div>
    </div>

    </div><!-- /.content -->

</div><!-- /.d-flex -->

<script>
    document.getElementById('toggleSidebar').addEventListener('click', function () {
        document.querySelector('.sidebar').classList.toggle('collapsed');
    });
</script>
<script src="feedback.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
